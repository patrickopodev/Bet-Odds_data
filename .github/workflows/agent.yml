name: Deep Research Agent

# Runs the TypeScript decision agent on its own cadence to continuously refresh
# data/agent-recommendations.json (consumed by the money path in betting.yml)
# WITHOUT delaying staking. It reads the odds database (collector.yml ->
# `odds-data` artifact) for context and persists its own outputs in the
# `agent-recs` artifact. Nothing is ever committed to `main`.

on:
  schedule:
    # Every 30 minutes. The agent pre-researches matches within AGENT_RESEARCH_HOURS
    # of kickoff (6h) and caches Flashscore feeds, so the file stays fresh.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: agent-research
  # Never kill an in-flight research run: a cancelled run would lose its work and
  # leave agent-recommendations.json stale. Let overruns queue instead.
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      AGENT_RESEARCH_HOURS: "6"
      AGENT_FEED_BUDGET: "30"
      # Favorite-value band is FROZEN at the validated [1.8, 2.2) via the strategy
      # registry (lib/favband.mjs). No FAV_BAND_LO/HI env: a validated strategy
      # must never be silently widened by a deployment variable (review action #1).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install chromium --with-deps

      - name: Build TypeScript agent
        run: npm run build:agent

      - name: Restore prior agent output + odds data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/restore-artifact.sh odds-data data
          bash scripts/restore-artifact.sh agent-recs data
          # Raw pre-match odds trajectory, for the research layer to derive
          # movement/steam features directly (it also arrives folded into
          # odds-db.json via the collector's build-db step).
          bash scripts/restore-artifact.sh prematch-data data

      - name: Verify Flashscore connectivity
        timeout-minutes: 2
        continue-on-error: true
        run: |
          # Quick check: is Flashscore reachable from this runner?
          # If not, the research step will fail fast instead of burning 75 min.
          node -e "
            const http = require('http');
            const req = http.get('https://www.flashscore.com/team/any/1/', (r) => { console.log('Flashscore reachable'); });
            req.on('error', (e) => { console.warn('WARNING: Flashscore unreachable (' + e.message + ')'); });
            req.setTimeout(5000, () => { console.warn('WARNING: Flashscore timed out'); req.destroy(); });
          "

      - name: Run deep research agent
        timeout-minutes: 75
        run: node dist/cli.js

      # Paper-trade scan: logs 1X2-favorite value picks (odds in [1.8,2.2))
      # to data/paper-picks.json with ZERO stake. --score-paper settles any whose
      # matches have since resolved, building a live out-of-sample track record.
      - name: Paper-trade scan (favorite value picks, no stake)
        timeout-minutes: 5
        run: node train-model-v5b.mjs --paper --score-paper

      - name: Upload agent output artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-recs
          path: |
            data/agent-recommendations.json
            data/agent-history.json
            data/standings-cache.json
            data/flashscore-feed-cache.json
            data/paper-picks.json
          if-no-files-found: warn
          retention-days: 90

      # Paper-trade progress dashboard. Reads only data/paper-picks.json (the
      # FAV_BAND 1X2 track) — kept separate from the correct-score analyzer. The
      # 30-resolved + positive-ROI gate is reported but NEVER auto-enables
      # staking; reaching it only marks the track eligible for human review.
      - name: Print paper-trade progress
        continue-on-error: true
        run: node paper-progress.mjs
