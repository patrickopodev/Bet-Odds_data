name: Pre-match Odds Monitor

# Records the final-30-minute pre-kickoff odds window for each match (5-min
# cadence) into data/prematch-*.json. These are part of the odds record that
# feeds the model. The logs persist in the `prematch-data` artifact; nothing is
# committed to `main`.

on:
  schedule:
    # Every 15 minutes. Matches enter their final-30-minute pre-match window at
    # different times all day, so overlapping runs keep the odds log continuous.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: prematch-monitor
  # Only one monitor runs at a time (cancel the older), so two runs never write
  # the same prematch-*.json concurrently. No `main` push happens.
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore prior pre-match logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/restore-artifact.sh prematch-data data

      - name: Record pre-match odds (final 30 min before kickoff, 5-min cadence)
        run: node prematch-monitor.mjs --window 30 --interval 300 --max 30

      - name: Upload pre-match data artifact
        uses: actions/upload-artifact@v4
        with:
          name: prematch-data
          path: |
            data/prematch/**/*.json
          if-no-files-found: warn
          retention-days: 90
