name: Manual Full-Card Odds Review

# HUMAN-IN-THE-LOOP review track, fully independent of automatic staking.
# Prints TODAY'S FULL LIST of games with every market's odds so a human can
# eyeball "perfect fitting" value across the whole card. It makes NO picks and
# never places a bet. FAV_BAND 1X2 was removed from this track; the agent's
# buildRecommendations (agent/analysis.ts) still owns that validated rule.
# Run on demand from the Actions tab.

on:
  workflow_dispatch: {}
  # Optional scheduled sweep so a fresh full-card review is always available.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: manual-slip
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install chromium --with-deps

      - name: Restore latest scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/restore-artifact.sh odds-data data

      - name: Print full-card review + generate value share-code
        run: node manual-slip.mjs

      - name: Upload generated value code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-code
          path: data/manual-code.txt
          if-no-files-found: warn
          retention-days: 7
