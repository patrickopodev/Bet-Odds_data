name: Stage 1 Market ROI

# Read-only research report: per-market historical ROI across the five raw
# SportyBet feeds (1X2 / O/U / Correct Score / Multigoals / Multiscores).
#
# Answers, before any new selector is written: which currently-unvalidated
# markets have enough resolved history to justify a 30-pick forward paper
# track? It reuses aggregateHistoricalStats (the exact analyze-odds.mjs
# methodology) so its numbers are comparable, and includes a 1X2 FAV_BAND
# control that must reproduce the known ~+16.8% OOS edge.
#
# Fully quarantined from the money path: it restores the read-only `odds-data`
# artifact, runs node stage1-market-roi.mjs (never selects or places a bet),
# and uploads its markdown report. Nothing is committed to `main`.

on:
  # Daily — the DB accumulates slowly; a daily snapshot is plenty for research.
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: stage1-market-roi
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pure .mjs report (lib/common.mjs, lib/favband.mjs) — no Playwright
      # browser needed, so we skip the chromium install on purpose.

      - name: Restore odds database (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/restore-artifact.sh odds-data data

      - name: Generate Stage 1 per-market ROI report
        # Best-effort: if the DB artifact is transiently unavailable the report
        # simply isn't produced rather than failing the run loudly.
        continue-on-error: true
        run: node stage1-market-roi.mjs

      - name: Upload Stage 1 report
        uses: actions/upload-artifact@v4
        with:
          name: stage1-market-roi
          path: data/stage1-market-roi.md
          if-no-files-found: warn
          retention-days: 90
