name: Odds Collector

# The ONLY workflow that needs to run all day: scrape every match's odds and
# fold them into the persistent odds database (data/odds-db.json) that the model
# and agent train/decide on. It is now fully decoupled from staking and research
# (see betting.yml / agent.yml).
#
# Persistence: instead of committing data/ to `main` (which caused push races
# between this and the other workflows), the accumulated store lives in the
# `odds-data` GitHub Artifact. Each run restores the latest artifact, appends
# this run's scrape, and re-uploads it. Nothing ever pushes to `main`.

on:
  schedule:
    # Every 30 minutes, around the clock.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: odds-collector
  # Finish an overrunning collection rather than cancel it mid-DB-write — a
  # cancelled build-db.mjs could leave odds-db.json half-written.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ALLOW_FRIENDLIES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore latest data artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/restore-artifact.sh odds-data data
          # prematch-data is folded into odds-db by build-db.mjs, so the model
          # only sees pre-match odds trajectories if we restore them here first.
          bash scripts/restore-artifact.sh prematch-data data

      # continue-on-error: a failed/empty scrape must NOT abort the run. The
      # script never overwrites latest.json on failure (see scraper.js), so the
      # restored previous-good data is preserved and re-uploaded below.
      - name: Run API scraper (full today's coverage)
        id: scrape
        timeout-minutes: 15
        continue-on-error: true
        run: node scraper.js

      - name: Build persistent odds database
        timeout-minutes: 5
        run: node build-db.mjs

      # Good/bad odds report feeds tomorrow's model; reads the DB we just built.
      - name: Generate good/bad odds report
        timeout-minutes: 10
        run: node analyze-odds.mjs --db

      - name: Upload odds data artifact
        uses: actions/upload-artifact@v4
        with:
          name: odds-data
          path: |
            data/odds-db.json
            data/latest.json
            data/performance.md
            data/snapshot-*.json
            data/report-*.md
          if-no-files-found: warn
          retention-days: 90
