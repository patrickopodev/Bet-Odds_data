name: Scheduled Web Scraper

on:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webscraper
  # Fresh data beats stale: a new scheduled run cancels a still-running older
  # one instead of queueing behind it (the old behavior piled up cancelled
  # runs and left the agent working off 12h-old scrapes). The placement steps
  # are short and idempotent-ish (unverified state on missing toast), so the
  # cancel risk during autoplace is smaller than the staleness cost.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      STAKE_PER_BET: 10
      MIN_CONFIDENCE: 0.6
      ALLOW_FRIENDLIES: "false"
      BANKROLL_DIVISOR: 2
      STAKE_PERCENT_OF_HALF: 0.25
      # Max ACTIVE slips (money at risk) at any time. Without a cap the 30-min
      # cron mints a fresh batch every run and can place slips faster than the
      # bankroll recycles — that runaway is what piled up a dozen+ slips in a
      # day. Tighten further if you want less exposure.
      STAKE_MAX_SLIPS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build the TypeScript agent up front so dist/ (confirm.js, monitor.js)
      # exists before the money path runs. The deep research step itself now
      # lives in its own workflow (agent.yml) so it can refresh
      # agent-recommendations.json continuously without delaying staking.
      - name: Build TypeScript agent
        run: npm run build:agent

      - name: Install Chromium for Playwright
        run: npx playwright-core install chromium --with-deps

      - name: Run API scraper (full today's coverage)
        id: scrape
        timeout-minutes: 15
        run: node scraper.js

      - name: Build persistent odds database
        timeout-minutes: 5
        run: node build-db.mjs

      # Money path FIRST, on the latest committed agent report. The agent runs
      # in a separate workflow (agent.yml) and continuously refreshes
      # agent-recommendations.json; placement re-verifies minOdds live regardless.
      - name: Select bets from agent recommendations
        timeout-minutes: 2
        continue-on-error: true
        run: node stake.mjs

      - name: Generate staking share code
        timeout-minutes: 10
        continue-on-error: true
        run: node stake-placement.mjs

      # Auto-staking is OPT-IN: this step only runs when the STAKE_AUTOPLACE_ENABLED
      # secret is set to "true". Without it, the workflow builds the slip + share
      # code for manual staking but never moves real money. Even when enabled,
      # STAKE_DRY_RUN=true skips the actual payment. Do not enable until a model
      # is validated out-of-sample (see backtest.mjs).
      - name: Auto-stake the slip on SportyBet (opt-in)
        if: ${{ secrets.STAKE_AUTOPLACE_ENABLED == 'true' }}
        env:
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASS: ${{ secrets.SB_PASS }}
          STAKE_DRY_RUN: ${{ secrets.STAKE_DRY_RUN }}
        timeout-minutes: 25
        run: node stake-autoplace.mjs

      - name: Agent confirms staked selections
        timeout-minutes: 15
        continue-on-error: true
        run: node dist/confirm.js

      - name: Agent monitors staked matches until they end
        timeout-minutes: 30
        continue-on-error: true
        run: node dist/monitor.js

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: |
            data/*.json
            data/*.md
          if-no-files-found: error
          retention-days: 90

      - name: Resolve finished matches (end-of-day)
        timeout-minutes: 20
        run: node resolve-results.mjs

      - name: Generate good/bad odds report (end-of-day, feeds tomorrow)
        timeout-minutes: 10
        run: node analyze-odds.mjs --db

      # Deep research now runs in agent.yml (separate cadence) which keeps
      # agent-recommendations.json fresh for the money path above.

      - name: Commit and push data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/patrickopodev/Bet-Odds_data.git"
          git add data/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to data; skipping commit."
          else
            # Commit first (pull --rebase refuses a dirty index), then rebase onto
            # any concurrent push from the pre-match monitor workflow, then push.
            git commit -m "chore(webscraper): update scraped data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin main
            git push
          fi