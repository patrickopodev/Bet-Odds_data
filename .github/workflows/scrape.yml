name: Scheduled Web Scraper

on:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webscraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      MAX_BETS: 3
      STAKE_PER_BET: 10
      MIN_CONFIDENCE: 0.6
      ALLOW_FRIENDLIES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install chromium --with-deps

      - name: Run API scraper (full today's coverage)
        id: scrape
        run: node scraper.js

      - name: Monitor final-30-minute pre-match odds (5-min cadence)
        run: node prematch-monitor.mjs --window 30 --interval 300 --max 45

      - name: Build persistent odds database
        run: node build-db.mjs

      - name: Resolve finished matches
        run: node resolve-results.mjs

      - name: Generate good/bad odds report
        run: node analyze-odds.mjs --db

      - name: Verify SportyBet coverage vs Flashscore
        run: node compare-coverage.mjs

      - name: Run TypeScript decision agent (deep research)
        run: |
          npm run build:agent
          node dist/cli.js

      - name: Select bets from agent recommendations
        run: node stake.mjs

      - name: Generate staking share code
        run: node stake-placement.mjs

      - name: Auto-stake the slip on SportyBet (optional)
        env:
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASS: ${{ secrets.SB_PASS }}
          STAKE_DRY_RUN: ${{ secrets.STAKE_DRY_RUN }}
        run: node stake-autoplace.mjs

      - name: Agent confirms staked selections
        run: node dist/confirm.js

      - name: Agent monitors staked matches until they end
        run: node dist/monitor.js

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: |
            data/*.json
            data/*.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to data; skipping commit."
          else
            git commit -m "chore(webscraper): update scraped data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi