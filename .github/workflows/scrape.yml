name: Scheduled Web Scraper

on:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webscraper
  # Fresh data beats stale: a new scheduled run cancels a still-running older
  # one instead of queueing behind it (the old behavior piled up cancelled
  # runs and left the agent working off 12h-old scrapes). The placement steps
  # are short and idempotent-ish (unverified state on missing toast), so the
  # cancel risk during autoplace is smaller than the staleness cost.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      STAKE_PER_BET: 10
      MIN_CONFIDENCE: 0.6
      ALLOW_FRIENDLIES: "false"
      BANKROLL_DIVISOR: 2
      STAKE_PERCENT_OF_HALF: 0.25
      # Max ACTIVE slips (money at risk) at any time. Without a cap the 30-min
      # cron mints a fresh batch every run and can place slips faster than the
      # bankroll recycles — that runaway is what piled up a dozen+ slips in a
      # day. Tighten further if you want less exposure.
      STAKE_MAX_SLIPS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install chromium --with-deps

      - name: Run API scraper (full today's coverage)
        id: scrape
        timeout-minutes: 15
        run: node scraper.js

      - name: Build persistent odds database
        timeout-minutes: 5
        run: node build-db.mjs

      - name: Run TypeScript decision agent (deep research)
        timeout-minutes: 45
        run: |
          npm run build:agent
          node dist/cli.js

      - name: Select bets from agent recommendations
        timeout-minutes: 2
        run: node stake.mjs

      - name: Generate staking share code
        timeout-minutes: 10
        run: node stake-placement.mjs

      - name: Auto-stake the slip on SportyBet (optional)
        env:
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASS: ${{ secrets.SB_PASS }}
          STAKE_DRY_RUN: ${{ secrets.STAKE_DRY_RUN }}
        timeout-minutes: 25
        run: node stake-autoplace.mjs

      - name: Agent confirms staked selections
        timeout-minutes: 15
        run: node dist/confirm.js

      - name: Agent monitors staked matches until they end
        timeout-minutes: 30
        run: node dist/monitor.js

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: |
            data/*.json
            data/*.md
          if-no-files-found: error
          retention-days: 90

      - name: Resolve finished matches (end-of-day)
        timeout-minutes: 20
        run: node resolve-results.mjs

      - name: Generate good/bad odds report (end-of-day, feeds tomorrow)
        timeout-minutes: 10
        run: node analyze-odds.mjs --db

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to data; skipping commit."
          else
            # The pre-match monitor workflow also commits data/ on a 15-min
            # cadence; rebase onto anything it pushed before committing so a
            # concurrent push can't fail this run.
            git pull --rebase origin main
            git commit -m "chore(webscraper): update scraped data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi