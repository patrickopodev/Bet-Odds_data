name: Scheduled Web Scraper

on:
  schedule:
    # Runs every 5 minutes (the minimum GitHub Actions interval.)
    # (5 fields: minute hour day-of-month month day-of-week).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webscraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        id: scrape
        run: node scraper.js
        env:
          SPORTYBET_PHONE: ${{ secrets.SPORTYBET_PHONE }}
          SPORTYBET_PASSWORD: ${{ secrets.SPORTYBET_PASSWORD }}

      - name: Build persistent odds database
        run: node build-db.mjs

      - name: Resolve finished matches
        run: node resolve-results.mjs

      - name: Generate good/bad odds report
        run: node analyze-odds.mjs --db

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: |
            data/*.json
            data/*.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to data; skipping commit."
          else
            git commit -m "chore(webscraper): update scraped data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi